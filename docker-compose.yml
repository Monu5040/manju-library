# Local development services. `make dev` starts them; Django and React run on your machine.
name: manju-library-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: manju
      POSTGRES_PASSWORD: manju
      POSTGRES_DB: manju
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manju -d manju"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
