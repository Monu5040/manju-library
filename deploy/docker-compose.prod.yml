# Staging and production stack for one VM. From the deploy/ folder, with a filled-in .env
# (whose COMPOSE_FILE picks this file), plain `docker compose ...` commands work.
# PostgreSQL is a managed service (DATABASE_URL), or runs on the VM via docker-compose.db.yml.
name: manju-library

x-django: &django
  build:
    context: ../backend
  image: manju-library/backend:${IMAGE_TAG:-latest}
  env_file: .env
  environment:
    APP_VERSION: ${IMAGE_TAG:-dev}  # shown on the System status page
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  backend:
    <<: *django

  worker:
    <<: *django
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    # Unhealthy when the worker stops answering: reminders and nightly jobs would stop.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10 > /dev/null"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  beat:
    <<: *django
    command:
      ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    image: manju-library/web:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:?Set SERVER_NAME in deploy/.env}
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Renews the HTTPS certificate; the first one comes from scripts/init-letsencrypt.sh.
  certbot:
    # Pinned (a moving "latest" could jump versions inside the container that holds the TLS
    # keys); Dependabot proposes updates.
    image: certbot/certbot:v5.10.0@sha256:c5698da859429ccee0fcc299a8000368198222d1f9e789ab6e388b491e8ce06d
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint:
      - /bin/sh
      - -c
      - "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Nightly database backup to object storage, run by cron on the host:
  #   cd deploy && docker compose --profile backup run --rm backup
  backup:
    build: ./backup
    image: manju-library/backup:${IMAGE_TAG:-latest}
    env_file: .env
    profiles: ["backup"]

volumes:
  letsencrypt:
  certbot-www:
  redis-data:
